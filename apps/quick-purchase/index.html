<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08264a"><title>سنابل | طلب المشتريات</title><style>:root{--navy:#08264a;--navy2:#0d3c70;--gold:#d6a640;--bg:#f4f7fb;--card:#fff;--text:#10233d;--muted:#6f7f93;--line:#dfe7f0;--green:#167a50;--red:#b83d3d;--shadow:0 12px 32px rgba(13,41,74,.10)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;font-size:16px}button,input,select{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--navy),var(--navy2));color:#fff;padding:14px 18px;box-shadow:0 4px 16px rgba(0,0,0,.12)}.toprow{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:900}.brand small{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:4px}.wrap{max-width:1180px;margin:18px auto;padding:0 14px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.soft{background:#edf3f8;color:var(--navy)}.btn.green{background:var(--green);color:#fff}.btn.red{background:#fff0f0;color:var(--red)}.login{max-width:460px;margin:8vh auto}.login h1{text-align:center;margin:0 0 8px}.login p{text-align:center;color:var(--muted);margin:0 0 18px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:800}.field input,.field select,.search,.qty,.supplier{width:100%;border:1px solid #ccd8e6;border-radius:12px;padding:12px;background:#fff;min-height:46px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .grow{flex:1;min-width:180px}.hero{background:linear-gradient(115deg,#092a54,#1d5a8c);color:#fff;border:0}.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;opacity:.8}.searchbox{display:flex;gap:8px}.searchbox input{flex:1}.results{display:grid;gap:8px;margin-top:10px}.result{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fbfdff}.result b{font-size:15px}.result small{display:block;color:var(--muted);margin-top:4px}.lines{display:grid;gap:10px}.line{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff}.lineHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.lineName{font-weight:900;font-size:16px}.lineMeta{font-size:12px;color:var(--muted);margin-top:4px}.lineGrid{display:grid;grid-template-columns:130px minmax(220px,1fr) 140px;gap:8px;align-items:end}.lineGrid label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 4px}.unitHint{margin-top:7px;font-size:12px;color:var(--muted)}.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(10px);z-index:30}.stickyin{max-width:1180px;margin:auto;display:flex;gap:9px;align-items:center}.sticky .sum{margin-left:auto;font-weight:900}.orders{display:grid;gap:8px}.order{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.order small{color:var(--muted);display:block;margin-top:4px}.sheet{position:fixed;inset:0;background:rgba(5,21,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheetBody{background:#fff;border-radius:20px 20px 10px 10px;width:min(720px,100%);max-height:82vh;overflow:auto;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.sheetTitle{font-size:20px;font-weight:900;margin-bottom:12px}.wa{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.waHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.notice{border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:800}.ok{background:#eaf7f0;color:#166743}.bad{background:#fff0ef;color:#9e3737}.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:700px){.lineGrid{grid-template-columns:1fr 1fr}.lineGrid>div:nth-child(2){grid-column:1/-1}.result{align-items:flex-start}.stickyin{flex-wrap:wrap}.sticky .sum{width:100%;order:-1;margin:0}.toprow{align-items:flex-start}.brand{font-size:18px}}</style></head><body><div id="loginView" class="wrap"><div class="card login"><h1>طلب المشتريات</h1><p>أسواق سنابل المع المركزية</p><div class="field"><label>المستخدم</label><select id="userSel"></select></div><div class="field"><label>الرقم السري</label><input id="pin" type="password" inputmode="numeric" placeholder="••••"></div><button id="loginBtn" class="btn primary" style="width:100%">دخول</button><div id="loginMsg"></div></div></div><div id="appView" class="hidden"><header class="top"><div class="toprow"><div class="brand">طلب المشتريات<small id="who"></small></div><button id="logoutBtn" class="btn soft">خروج</button></div></header><main class="wrap"><section class="card hero"><h2>طلبية سريعة</h2><p>ابحث عن الصنف، اكتب الكمية، والمورد يظهر تلقائيًا.</p></section><section class="card"><div class="toolbar"><button id="newBtn" class="btn gold">＋ طلبية جديدة</button><button id="ordersBtn" class="btn soft">الطلبيات المحفوظة</button><div class="grow"></div><b id="orderNo">طلبية جديدة</b></div></section><section class="card"><div class="searchbox"><input id="productSearch" class="search" placeholder="ابحث باسم الصنف أو الباركود"><button id="searchBtn" class="btn primary">بحث</button></div><div id="searchResults" class="results"></div></section><section class="card"><div class="toolbar" style="margin-bottom:12px"><b style="font-size:19px">أصناف الطلبية</b><span id="countText" style="color:var(--muted)">0 صنف</span></div><div id="lines" class="lines"><div class="empty">ابدأ بالبحث عن صنف وإضافته.</div></div></section></main><div class="sticky"><div class="stickyin"><div class="sum" id="sum">0 صنف</div><button id="saveBtn" class="btn primary">💾 حفظ</button><button id="waBtn" class="btn green">واتساب للمورد</button></div></div></div><div id="sheet" class="sheet hidden"><div class="sheetBody"><div class="toolbar"><div class="sheetTitle" id="sheetTitle">الطلبيات</div><div class="grow"></div><button id="sheetClose" class="btn soft">إغلاق</button></div><div id="sheetContent"></div></div></div><script>const INV='https://rueapdmdkjytsxkfumpw.supabase.co/functions/v1/sanabel-inventory-api-v2',API='https://rueapdmdkjytsxkfumpw.supabase.co/functions/v1/sanabel-almae-web-login-probe';let token=localStorage.getItem('spl_staff_token')||'',user=null,suppliers=[],lines=[],orderId=null,currentOrder=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function call(url,body,auth=true){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...(auth&&token?{'authorization':'Bearer '+token}:{})},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||'تعذر تنفيذ العملية');return d}function msg(el,text,ok=false){el.innerHTML='<div class="notice '+(ok?'ok':'bad')+'">'+esc(text)+'</div>'}async function boot(){try{const d=await call(INV,{action:'login_options'},false);$('#userSel').innerHTML=(d.users||[]).map(u=>'<option value="'+u.id+'">'+esc(u.name)+'</option>').join('');if(token){try{const m=await call(INV,{action:'me'});user=m.user;showApp();return}catch{token='';localStorage.removeItem('spl_staff_token')}}}catch(e){msg($('#loginMsg'),e.message)}}$('#loginBtn').onclick=async()=>{try{const d=await call(INV,{action:'login',user_id:$('#userSel').value,pin:$('#pin').value},false);token=d.token;user=d.user;localStorage.setItem('spl_staff_token',token);showApp()}catch(e){msg($('#loginMsg'),e.message)}};$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});async function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#who').textContent=(user?.name||'')+' — '+roleName(user?.role);await loadSuppliers();render()}function roleName(r){return r==='owner'?'مالك':r==='manager'?'مدير':r==='purchasing'?'مشرف المشتريات':'عامل'}$('#logoutBtn').onclick=()=>{localStorage.removeItem('spl_staff_token');location.reload()};async function loadSuppliers(){const d=await call(API,{action:'quick_suppliers'});suppliers=d.data||[]}$('#searchBtn').onclick=searchProducts;$('#productSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchProducts()});async function searchProducts(){const q=$('#productSearch').value.trim();if(q.length<2)return;$('#searchResults').innerHTML='<div class="empty">جاري البحث…</div>';try{const d=await call(API,{action:'quick_product_search',q});const rows=d.data||[];$('#searchResults').innerHTML=rows.length?rows.map(x=>'<div class="result"><div><b>'+esc(x.product_name)+'</b><small>'+esc(x.barcode||'')+' • المورد: '+esc(x.supplier_name)+'</small></div><button class="btn gold add" data-id="'+x.smart_product_id+'">إضافة</button></div>').join(''):'<div class="empty">لا توجد نتائج</div>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>addProduct(rows.find(x=>String(x.smart_product_id)===b.dataset.id)))}catch(e){msg($('#searchResults'),e.message)}}function addProduct(x){const old=lines.find(y=>String(y.smart_product_id)===String(x.smart_product_id));if(old)old.quantity=Number(old.quantity||0)+1;else lines.push({...x,quantity:1});$('#productSearch').value='';$('#searchResults').innerHTML='';render()}function supplierOptions(selected){return suppliers.map(s=>'<option value="'+s.id+'" '+(String(s.id)===String(selected)?'selected':'')+'>'+esc(s.name)+'</option>').join('')}function render(){$('#orderNo').textContent=currentOrder?.order_no||'طلبية جديدة';$('#countText').textContent=lines.length+' صنف';$('#sum').textContent=lines.length+' صنف';$('#lines').innerHTML=lines.length?lines.map((x,i)=>'<div class="line"><div class="lineHead"><div><div class="lineName">'+esc(x.product_name)+'</div><div class="lineMeta">'+esc(x.barcode||'')+(x.order_unit_name?' • وحدة الطلب: '+esc(x.order_unit_name):'')+'</div></div><button class="btn red del" data-i="'+i+'">حذف</button></div><div class="lineGrid"><div><label>الكمية</label><input class="qty" type="number" min="0.01" step="0.01" value="'+Number(x.quantity||1)+'" data-i="'+i+'"></div><div><label>المورد</label><select class="supplier" data-i="'+i+'">'+supplierOptions(x.supplier_id)+'</select></div><div><label>الوحدة</label><input class="qty" value="'+esc(x.order_unit_name||x.base_unit_name||'وحدة')+'" disabled></div></div><div class="unitHint">المورد المحدد سيبقى الافتراضي لهذا الصنف بعد الحفظ ويمكن تغييره لاحقًا.</div></div>').join(''):'<div class="empty">ابدأ بالبحث عن صنف وإضافته.</div>';document.querySelectorAll('.qty[data-i]').forEach(e=>e.oninput=()=>{lines[+e.dataset.i].quantity=Number(e.value||0)});document.querySelectorAll('.supplier').forEach(e=>e.onchange=()=>{const i=+e.dataset.i,s=suppliers.find(z=>String(z.id)===String(e.value));if(s){lines[i].supplier_id=s.id;lines[i].supplier_name=s.name;lines[i].supplier_phone=s.phone||''}});document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.i,1);render()})}$('#newBtn').onclick=()=>{orderId=null;currentOrder=null;lines=[];render()};$('#saveBtn').onclick=async()=>{if(!lines.length)return alert('أضف صنفًا واحدًا على الأقل');if(lines.some(x=>!(Number(x.quantity)>0)))return alert('راجع الكميات');const b=$('#saveBtn'),old=b.textContent;b.disabled=true;b.textContent='جاري الحفظ…';try{const d=await call(API,{action:'quick_order_save',order_id:orderId,lines:lines.map(x=>({smart_product_id:x.smart_product_id,quantity:Number(x.quantity),supplier_id:x.supplier_id}))});currentOrder=d.data;orderId=d.data.id;b.textContent='✓ تم الحفظ';setTimeout(()=>b.textContent=old,1200)}catch(e){alert(e.message);b.textContent=old}finally{b.disabled=false}};$('#ordersBtn').onclick=async()=>{openSheet('الطلبيات المحفوظة','<div class="empty">جاري التحميل…</div>');try{const d=await call(API,{action:'quick_order_list'}),a=d.data||[];$('#sheetContent').innerHTML=a.length?'<div class="orders">'+a.map(o=>'<div class="order"><div><b>'+esc(o.order_no)+'</b><small>أنشأها '+esc(o.created_by_name)+' • '+new Date(o.updated_at).toLocaleString('ar-SA-u-ca-gregory')+'</small></div><button class="btn soft openOrder" data-id="'+o.id+'">فتح</button></div>').join('')+'</div>':'<div class="empty">لا توجد طلبيات محفوظة</div>';document.querySelectorAll('.openOrder').forEach(b=>b.onclick=()=>loadOrder(b.dataset.id))}catch(e){msg($('#sheetContent'),e.message)}};async function loadOrder(id){try{const d=await call(API,{action:'quick_order_get',order_id:id});orderId=d.data.order.id;currentOrder=d.data.order;lines=(d.data.lines||[]).map(x=>({...x,quantity:Number(x.quantity)}));closeSheet();render()}catch(e){alert(e.message)}}$('#waBtn').onclick=async()=>{if(!orderId){alert('احفظ الطلبية أولًا');return}openSheet('إرسال واتساب للمورد','<div class="empty">جاري تجهيز الرسائل…</div>');try{const d=await call(API,{action:'quick_whatsapp',order_id:orderId}),g=d.data.groups||[];$('#sheetContent').innerHTML=g.length?g.map(x=>'<div class="wa"><div class="waHead"><div><b>'+esc(x.supplier_name)+'</b><small style="display:block;color:var(--muted)">'+x.line_count+' صنف'+(x.phone_info?.valid?' • '+esc(x.phone):' • لا يوجد رقم واتساب صالح')+'</small></div>'+(x.url?'<button class="btn green waOpen" data-sid="'+x.supplier_id+'" data-url="'+encodeURIComponent(x.url)+'">فتح واتساب</button>':'<button class="btn soft" disabled>بدون رقم</button>')+'</div></div>').join(''):'<div class="empty">لا توجد أصناف</div>';document.querySelectorAll('.waOpen').forEach(b=>b.onclick=async()=>{try{await call(API,{action:'quick_whatsapp_log',order_id:orderId,supplier_id:b.dataset.sid});window.open(decodeURIComponent(b.dataset.url),'_blank')}catch(e){alert(e.message)}})}catch(e){msg($('#sheetContent'),e.message)}};function openSheet(t,c){$('#sheetTitle').textContent=t;$('#sheetContent').innerHTML=c;$('#sheet').classList.remove('hidden')}function closeSheet(){$('#sheet').classList.add('hidden')}$('#sheetClose').onclick=closeSheet;$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};boot();</script></body></html>
