<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#166534"><title>سنابل | طباعة العروض</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f5;color:#111}.app{max-width:1250px;margin:auto;padding:18px;display:grid;grid-template-columns:370px 1fr;gap:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 22px #0001}h1{font-size:23px;margin:0 0 16px;color:#166534}.sizes{display:flex;gap:8px;margin-bottom:14px}.sizes button{flex:1}.row{margin:10px 0}label{display:block;font-weight:800;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:17px}.toggle{display:flex;align-items:center;gap:8px;margin:11px 0}.toggle input{width:auto;transform:scale(1.25)}button{padding:12px 14px;border:0;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}.active,.print{background:#166534;color:#fff}.muted{background:#e5e7eb}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.note{font-size:13px;line-height:1.7;color:#555;margin-top:12px}.preview{display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:10px}.paper{position:relative;background:#fff;color:#000;box-shadow:0 5px 22px #0002;overflow:hidden}.paper.a4{width:210mm;height:297mm}.paper.small{width:130mm;height:120mm}.reserved{position:absolute;left:0;right:0;top:0;border-bottom:1px dashed #bbb;text-align:center;color:#aaa;font-size:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}.a4 .reserved{height:112mm}.small .reserved{height:40mm}.offer{position:absolute;text-align:center;font-weight:900;left:0;right:0;margin:auto}.a4 .offer{top:118mm;width:170mm}.small .offer{top:43mm;width:114mm}.name,.desc,.oldBlock,.offerLabel,.price,.riyal,.vat,.expiry{width:100%;text-align:center;margin-left:auto;margin-right:auto}.name{font-size:13mm;line-height:1.05}.desc{font-size:7mm;margin-top:2mm}.oldBlock{margin-top:7mm;font-size:5mm}.oldPrice{font-size:9mm;text-decoration:line-through;text-decoration-thickness:1mm}.discount{position:absolute;right:-5mm;top:48mm;width:37mm;height:37mm;border:1.4mm solid #000;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7mm;line-height:1.05;background:#fff;font-weight:900;white-space:nowrap}.discountValue{direction:ltr;unicode-bidi:isolate}.offerLabel{font-size:6mm;margin-top:6mm}.price{font-size:21mm;line-height:1}.riyal{font-size:5mm}.vat{font-size:4.2mm;font-weight:800;margin-top:1.5mm}.expiry{font-size:4.5mm;margin-top:5mm}.small .name{font-size:7mm}.small .desc{font-size:4mm;margin-top:1mm}.small .oldBlock{font-size:3.2mm;margin-top:2mm}.small .oldPrice{font-size:5mm}.small .discount{right:-3mm;top:22mm;width:22mm;height:22mm;font-size:4mm;border-width:.8mm}.small .offerLabel{font-size:3.5mm;margin-top:2mm}.small .price{font-size:11mm}.small .riyal{font-size:3mm}.small .vat{font-size:2.4mm;margin-top:.6mm}.small .expiry{font-size:2.8mm;margin-top:1.5mm}.hidden{display:none!important}@media(max-width:850px){.app{grid-template-columns:1fr}.preview{justify-content:flex-start}.paper.a4{transform:scale(.48);transform-origin:top right;margin-bottom:-150mm}.paper.small{transform:scale(.8);transform-origin:top right;margin-bottom:-20mm}}@media print{html,body{margin:0!important;padding:0!important;overflow:hidden!important;background:#fff;width:100%;height:100%}.card,.reserved{display:none!important}.app{display:block!important;padding:0!important;margin:0!important;max-width:none!important;width:auto!important;height:auto!important}.preview{display:block!important;padding:0!important;margin:0!important;overflow:hidden!important;width:auto!important;height:auto!important}.paper{position:relative!important;box-shadow:none!important;transform:none!important;margin:0!important;padding:0!important;break-after:avoid!important;page-break-after:avoid!important;break-inside:avoid!important;page-break-inside:avoid!important}.paper.a4{width:209mm!important;height:296mm!important}.paper.small{width:129mm!important;height:119mm!important}.discount{background:transparent}}@page{margin:0}</style></head><body><main class="app"><section class="card"><h1>طباعة عروض سنابل</h1><div class="sizes"><button id="a4Btn" class="active">A4 كبير</button><button id="smallBtn" class="muted">13 × 12 سم</button></div><div class="row"><label>اسم المنتج</label><input id="name" value="سكر الأسرة"></div><div class="row"><label>الوصف / الوزن</label><input id="desc" value="خشن 5 كيلو"></div><div class="toggle"><input type="checkbox" id="showOld" checked><label>إظهار السعر السابق</label></div><div class="row"><label>السعر السابق</label><input id="old" type="number" step="0.01" value="18"></div><div class="row"><label>سعر العرض</label><input id="price" type="number" step="0.01" value="14.96"></div><div class="toggle"><input type="checkbox" id="showDiscount" checked><label>إظهار «وفر %»</label></div><div class="toggle"><input type="checkbox" id="showExpiry" checked><label>إظهار «العرض ساري حتى»</label></div><div class="row" id="dateRow"><label>تاريخ نهاية العرض</label><input id="date" value="2026/9/26"></div><div class="actions"><button class="print" id="printBtn">طباعة العرض</button><button class="muted" id="clearBtn">تفريغ</button></div><div class="note">السعر شامل ضريبة القيمة المضافة يظهر تلقائيًا في جميع العروض. الطباعة أسود وأبيض فقط فوق الورق الملون الجاهز. في المقاس الصغير أول 4 سم من الأعلى محجوزة للشعار و«عرض خاص».</div></section><section class="preview"><div id="paper" class="paper a4"><div class="reserved">الجزء المطبوع مسبقًا على الورقة</div><div class="offer"><div class="name" id="pName"></div><div class="desc" id="pDesc"></div><div class="oldBlock" id="oldBlock"><div>السعر السابق</div><div class="oldPrice" id="pOld"></div></div><div class="discount" id="discount"></div><div class="offerLabel">سعر العرض</div><div class="price" id="pPrice"></div><div class="riyal">ريال</div><div class="vat">السعر شامل ضريبة القيمة المضافة</div><div class="expiry" id="expiry"></div></div></div></section></main><script>const g=id=>document.getElementById(id);let size='a4';function sync(){g('pName').textContent=g('name').value;g('pDesc').textContent=g('desc').value;g('pOld').textContent=g('old').value;g('pPrice').textContent=g('price').value;g('oldBlock').classList.toggle('hidden',!g('showOld').checked);let o=parseFloat(g('old').value),p=parseFloat(g('price').value),d=(o>0&&p>=0&&p<o)?Math.round((o-p)/o*100):0;g('discount').innerHTML='<span>وفر</span><span class="discountValue">%'+d+'</span>';g('discount').classList.toggle('hidden',!g('showDiscount').checked||!d);g('expiry').textContent='العرض ساري حتى '+g('date').value;g('expiry').classList.toggle('hidden',!g('showExpiry').checked);g('dateRow').classList.toggle('hidden',!g('showExpiry').checked)}function setSize(s){size=s;g('paper').className='paper '+s;g('a4Btn').className=s==='a4'?'active':'muted';g('smallBtn').className=s==='small'?'active':'muted'}document.querySelectorAll('input').forEach(x=>{x.addEventListener('input',sync);x.addEventListener('change',sync)});g('a4Btn').onclick=()=>setSize('a4');g('smallBtn').onclick=()=>setSize('small');g('printBtn').onclick=()=>{sync();let st=document.getElementById('dynPrint');if(st)st.remove();st=document.createElement('style');st.id='dynPrint';st.textContent='@media print{@page{size:'+(size==='a4'?'A4':'130mm 120mm')+';margin:0}}';document.head.appendChild(st);setTimeout(()=>window.print(),100)};g('clearBtn').onclick=()=>{g('name').value='';g('desc').value='';g('old').value='';g('price').value='';g('date').value='';sync()};sync();</script></body></html>
