<style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#0b1736;--muted:#73809a;--line:#e6edf5;--nav:#071a34;--nav2:#0d2b4b;--gold:#c99735;--orange:#ef7d18;--green:#16b978;--blue:#2277f5;--red:#e5484d;--shadow:0 14px 35px rgba(13,34,66,.08);--r:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tajawal,Arial,sans-serif;background:linear-gradient(135deg,#f9fbff,#eef4fb);color:var(--ink);font-size:16px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.ltr{direction:ltr;text-align:left}.muted{color:var(--muted)}.wide{width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#17496e 0,#071a34 52%,#04111f 100%)}
.login-card{width:min(440px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.login-logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#c99735,#fff2c8);display:grid;place-items:center;font-size:42px;margin:auto}
.login h1{text-align:center;margin:14px 0 4px;font-size:29px}.login p{text-align:center;color:var(--muted);font-weight:700}.pin{width:100%;height:58px;border:1px solid #ccd8e7;border-radius:16px;padding:0 18px;font-size:26px;letter-spacing:6px;text-align:center;outline:0}.pin:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(239,125,24,.1)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:900}.btn.primary{background:linear-gradient(135deg,#b6761a,#ef8d22);color:#fff}.btn.secondary{background:#eef4ff;color:#174f9e;border:1px solid #d7e4f6}.btn.success{background:#dcfce7;color:#166534}.btn.danger{background:#fee2e2;color:#991b1b}.btn.dark{background:var(--nav);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}
.shell{display:grid;grid-template-columns:282px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#06172e,#0a2440);color:#dbeafe;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}.brand-mark{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,#d89f39,#fff2c8);display:grid;place-items:center;font-size:30px;color:#12233f}.brand h1{margin:0;color:#fff;font-size:21px}.brand small{color:#9fb4d2;font-weight:700}.version{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.09);font-size:11px;color:#f8d993}
.userbox{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:12px;margin:12px 0 16px}.userbox b{display:block;color:#fff}.userbox small{color:#9fb4d2}
.nav{display:grid;gap:5px}.nav button{border:0;width:100%;display:flex;align-items:center;gap:10px;background:transparent;color:#dbeafe;border-radius:14px;padding:12px 13px;text-align:right;font-weight:900}.nav button.active,.nav button:hover{background:linear-gradient(135deg,#b6761a,#ef8d22);color:white}.nav .ico{width:27px;text-align:center;font-size:20px}
.main{padding:20px 24px 70px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.title h2{margin:0;font-size:30px}.title p{margin:3px 0 0;color:var(--muted);font-weight:700}.top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.cloud{padding:8px 12px;border-radius:99px;font-weight:900;font-size:13px;background:#e8f8ef;color:#18794e}.cloud.busy{background:#fff4d6;color:#8a5b00}.cloud.bad{background:#fee2e2;color:#991b1b}
.hero{background:linear-gradient(135deg,#0a2a58,#0c7264);border-radius:26px;padding:25px 28px;color:#fff;box-shadow:0 22px 58px rgba(7,26,52,.18);display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.hero h2{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:#d8e7ff;font-weight:700}
.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(150px,1fr));margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}.kpi span{color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:28px;margin-top:8px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h3{margin:0;font-size:21px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd8e8;border-radius:14px;padding:12px;background:#fff;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#e69124;box-shadow:0 0 0 3px rgba(230,145,36,.1)}.field textarea{min-height:100px}.span-2{grid-column:span 2}.span-3{grid-column:span 3}
.lookup{position:relative}.suggestions{position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(13,34,66,.14);max-height:280px;overflow:auto;z-index:30}.suggestions button{border:0;width:100%;background:#fff;text-align:right;padding:10px 12px;border-bottom:1px solid #eef2f7}.suggestions button:hover{background:#fff7ed}.suggestions small{display:block;color:var(--muted)}.supplier-lookup .suggestions{border:2px solid #e69124}.supplier-lookup .suggestions button{font-size:16px;padding:13px 14px}.supplier-lookup .suggestions b{font-size:17px}
.note{background:#f7faff;border:1px solid #dce8f7;border-radius:14px;padding:12px;line-height:1.7}.empty{text-align:center;padding:30px;color:var(--muted)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0 7px;min-width:760px}th{text-align:right;color:#64748b;font-size:13px;padding:0 9px;white-space:nowrap}td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 9px;vertical-align:middle}td:first-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}td:last-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-weight:900;font-size:12px}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.report-hub{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.report-card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:var(--shadow)}.report-card .icon{font-size:40px}.report-card h3{margin:9px 0 6px}.report-card p{color:var(--muted);min-height:48px}.report-card button{width:100%}
.modal-wrap{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:1000;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:24px;width:min(1000px,100%);max-height:92vh;overflow:auto;padding:20px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-head h3{margin:0}.close{border:0;width:38px;height:38px;border-radius:12px;background:#f1f5f9;font-size:22px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px}.purchase-item-row{display:grid;grid-template-columns:2fr .7fr .8fr .8fr auto;gap:8px;margin-bottom:8px;align-items:center}.purchase-item-row input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px}
.toast-root{position:fixed;left:18px;bottom:18px;z-index:3000;display:grid;gap:8px}.toast{background:#071a34;color:#fff;border-radius:14px;padding:12px 15px;box-shadow:0 12px 30px rgba(0,0,0,.22);min-width:240px}
@media(max-width:1000px){.kpis,.report-hub{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr 1fr}.span-3{grid-column:span 2}}
@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{grid-template-columns:1fr 1fr}.main{padding:15px}.topbar,.hero{align-items:flex-start;flex-direction:column}.form-grid,.kpis,.report-hub{grid-template-columns:1fr}.span-2,.span-3{grid-column:span 1}.purchase-item-row{grid-template-columns:1fr 1fr}.purchase-item-row>*:first-child{grid-column:span 2}}
@media print{.sidebar,.topbar,.no-print,.btn{display:none!important}.shell{display:block}.main{padding:0}.card{box-shadow:none}}

.records-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.records-toolbar input{flex:1;min-width:220px;border:1px solid #cbd8e8;border-radius:12px;padding:10px 12px}
.record-actions{display:flex;gap:6px;flex-wrap:wrap}
.print-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}


.supplier-rank-list{display:grid;gap:9px}
.supplier-rank-row{display:grid;grid-template-columns:42px minmax(180px,1.8fr) repeat(4,minmax(90px,.7fr));gap:9px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:11px 12px;background:#fff}
.supplier-rank-no{width:32px;height:32px;border-radius:10px;background:#fff3e0;display:grid;place-items:center;font-weight:900;color:#a55e00}
.supplier-rank-name{font-weight:900}.supplier-rank-metric small{display:block;color:var(--muted);font-weight:700}.supplier-rank-metric b{font-size:16px}
@media(max-width:900px){.supplier-rank-row{grid-template-columns:38px 1fr 1fr}.supplier-rank-name{grid-column:span 2}.supplier-rank-metric{padding-top:4px}}
</style>

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
(()=>{
'use strict';
const VERSION='V5.0.7 Cloud';
const SUPABASE_URL='https://rueapdmdkjytsxkfumpw.supabase.co';
const SUPABASE_KEY='sb_publishable_CihlHx8brphzcuqf3imxeA_u9a1zVy9';
const T={products:'expiry_products',expiry:'expiry_expired',replacements:'expiry_replacements',purchases:'expiry_purchase_receipts',purchaseItems:'expiry_purchase_items',users:'expiry_users',audit:'expiry_audit_log',settings:'expiry_settings'};
const api=`${SUPABASE_URL}/rest/v1`;
const headers={'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
let sb=null,realtime=null,currentUser=null,route='dashboard',cloudState='busy',cloudText='جاري الاتصال…';
let st={products:[],expiry:[],replacements:[],purchases:[],purchaseItems:[],users:[],audit:[],settings:{business:'أسواق سنابل المع المركزية',defaultSupplier:'مورد عام',suppliers:['مورد عام'],smartTax:'15%'}};
let productMap=new Map(),productPage=1,productQuery='',reportView='home',purchaseDraft=null;

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0, money=v=>num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
const now=()=>new Date().toISOString(), today=()=>new Date().toISOString().slice(0,10);
const uid=p=>`${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
const rowPayload=r=>r?.payload&&typeof r.payload==='object'?r.payload:null;
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('#toastRoot').appendChild(d);setTimeout(()=>d.remove(),2800)}
function setCloud(s,t){cloudState=s;cloudText=t;const el=$('#cloudChip');if(el){el.className=`cloud ${s==='busy'?'busy':s==='bad'?'bad':''}`;el.textContent=t}}
function rebuildProductMap(){productMap=new Map();for(const p of st.products){if(p.id)productMap.set(String(p.id),p);if(p.barcode)productMap.set('b:'+String(p.barcode),p);if(p.smartCode)productMap.set('s:'+String(p.smartCode),p)}}
function getProduct(id){return productMap.get(String(id))}
function suppliers(){return [...new Set(['مورد عام',...(st.settings.suppliers||[])].filter(Boolean))]}
function hasPerm(k){if(!currentUser)return false;if(currentUser.role==='مدير')return true;const p=currentUser.permissions||{};if(k in p)return !!p[k];const defaults={'view.dashboard':1,'view.expiry':1,'expiry.add':1,'view.replacement':1,'replacement.add':1,'view.purchases':1,'purchases.add':1};return !!defaults[k]}
function saveSession(){sessionStorage.setItem('expiry_v5_user',currentUser?.id||'')}
function restoreSession(){const id=sessionStorage.getItem('expiry_v5_user');if(id)currentUser=st.users.find(x=>String(x.id)===String(id))||null}
async function rest(path,{method='GET',body=null,prefer='return=representation'}={}){const h={...headers};if(prefer)h.Prefer=prefer;const r=await fetch(`${api}/${path}`,{method,headers:h,body:body?JSON.stringify(body):undefined});if(!r.ok){const txt=await r.text();throw new Error(txt||`HTTP ${r.status}`)}if(r.status===204)return [];const txt=await r.text();return txt?JSON.parse(txt):[]}
async function fetchPages(table,select='payload',order='updated_at.desc'){let out=[],offset=0;for(;;){const rows=await rest(`${table}?select=${encodeURIComponent(select)}&order=${order}&limit=1000&offset=${offset}`);out.push(...rows);if(rows.length<1000)break;offset+=1000}return out}
function canonProduct(r){const p=rowPayload(r)||r;return p?{unit:'حبة',unitCode:p.unitCode||p.unit||'حبة',taxRate:p.taxRate||'15%',salePrice:num(p.salePrice),category:p.category||'',...p}:null}
function canon(r){return rowPayload(r)||r}
async function loadCloud(){
 setCloud('busy','جاري تحميل السحابة…');
 const [settings,users,expiry,repls,purs,pitems,audit]=await Promise.all([
  rest(`${T.settings}?id=eq.main&select=payload`),
  rest(`${T.users}?select=payload&order=updated_at.asc`),
  rest(`${T.expiry}?select=payload&order=created_at.desc`),
  rest(`${T.replacements}?select=payload&order=created_at.desc`),
  rest(`${T.purchases}?select=payload&order=created_at.desc`),
  rest(`${T.purchaseItems}?select=payload&order=updated_at.asc`),
  rest(`${T.audit}?select=payload&order=created_at.desc&limit=500`)
 ]);
 st.settings={...st.settings,...(settings[0]?.payload||{})};
 st.users=users.map(canon).filter(Boolean);st.expiry=expiry.map(canon).filter(Boolean);st.replacements=repls.map(canon).filter(Boolean);
 st.purchases=purs.map(canon).filter(Boolean);st.purchaseItems=pitems.map(canon).filter(Boolean);st.audit=audit.map(canon).filter(Boolean);
 restoreSession();
 render();
 setCloud('busy','جاري تحميل الأصناف…');
 const products=await fetchPages(T.products,'payload','updated_at.desc');
 st.products=products.map(canonProduct).filter(Boolean);rebuildProductMap();
 setCloud('ok','متزامن لحظيًا');render();
}
async function upsert(table,row,extra={}){const raw={id:String(row.id),payload:row,updated_at:now(),updated_by:currentUser?.name||'النظام',...extra};return rest(`${table}?on_conflict=id`,{method:'POST',body:[raw],prefer:'resolution=merge-duplicates,return=representation'})}
async function patch(table,id,patch){return rest(`${table}?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:patch})}
async function remove(table,id){return rest(`${table}?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'})}
async function audit(action,detail=''){const a={id:uid('a'),at:now(),user:currentUser?.name||'النظام',action,detail};st.audit.unshift(a);try{await upsert(T.audit,a,{action:a.action,detail:a.detail,user_name:a.user,created_at:a.at})}catch(e){console.warn(e)}}
function upsertLocal(arr,obj){const i=arr.findIndex(x=>String(x.id)===String(obj.id));if(i>=0)arr[i]={...arr[i],...obj};else arr.unshift(obj)}
function setupRealtime(){
 if(!window.supabase?.createClient)return;
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
 if(realtime)try{sb.removeChannel(realtime)}catch{}
 realtime=sb.channel('expiry-v5-live');
 [T.expiry,T.replacements,T.purchases,T.purchaseItems,T.users,T.settings].forEach(table=>{
  realtime.on('postgres_changes',{event:'*',schema:'public',table},payload=>{
   const evt=payload.eventType,row=payload.new||{},old=payload.old||{},obj=rowPayload(row);
   if(evt==='DELETE'){const id=old.id;const map={[T.expiry]:'expiry',[T.replacements]:'replacements',[T.purchases]:'purchases',[T.purchaseItems]:'purchaseItems',[T.users]:'users'};const key=map[table];if(key)st[key]=st[key].filter(x=>String(x.id)!==String(id))}
   else if(table===T.settings&&obj)st.settings={...st.settings,...obj};
   else if(obj){const map={[T.expiry]:'expiry',[T.replacements]:'replacements',[T.purchases]:'purchases',[T.purchaseItems]:'purchaseItems',[T.users]:'users'};const key=map[table];if(key)upsertLocal(st[key],obj)}
   if(table===T.users&&currentUser)currentUser=st.users.find(x=>String(x.id)===String(currentUser.id))||currentUser;
   renderSoft();
  });
 });
 realtime.subscribe(status=>setCloud(status==='SUBSCRIBED'?'ok':status==='CHANNEL_ERROR'?'bad':'busy',status==='SUBSCRIBED'?'متزامن لحظيًا':status==='CHANNEL_ERROR'?'مشكلة اتصال':'جاري الاتصال…'));
}
function renderSoft(){if(!currentUser)return render();const active=document.activeElement;if(active&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName))return;render()}
function stockRows(){
 const m=new Map();
 for(const e of st.expiry){const p=getProduct(e.productId)||{id:e.productId,name:e.productName||'صنف غير معروف',barcode:e.barcode||''};if(!m.has(p.id))m.set(p.id,{p,original:0,remaining:0,value:0,oldest:''});const x=m.get(p.id);x.original+=num(e.qty);x.remaining+=num(e.remaining);x.value+=num(e.remaining)*num(e.cost);if(num(e.remaining)>0&&e.expiryDate&&(!x.oldest||e.expiryDate<x.oldest))x.oldest=e.expiryDate}
 return [...m.values()].map(x=>({...x,replaced:x.original-x.remaining})).filter(x=>x.original>0)
}
function available(productId){return st.expiry.filter(x=>String(x.productId)===String(productId)).reduce((a,x)=>a+num(x.remaining),0)}
function availableBySupplier(productId,supplier){const ns=normalizeSupplierText(supplier||'');return st.expiry.filter(x=>String(x.productId)===String(productId)&&normalizeSupplierText(x.supplier||'مورد عام')===ns).reduce((a,x)=>a+num(x.remaining),0)}
function findProduct(q){q=String(q||'').trim();if(!q)return null;return productMap.get('b:'+q)||productMap.get('s:'+q)||st.products.find(p=>String(p.name||'').toLowerCase()===q.toLowerCase())||null}
function matchesProducts(q,limit=8){q=String(q||'').trim().toLowerCase();if(!q)return [];const exact=findProduct(q);const rows=st.products.filter(p=>String(p.barcode||'').includes(q)||String(p.smartCode||'').includes(q)||String(p.name||'').toLowerCase().includes(q));if(exact&&!rows.some(x=>x.id===exact.id))rows.unshift(exact);return rows.slice(0,limit)}
const nav=[
 ['dashboard','🏠','الرئيسية','view.dashboard'],['expiry','⏳','تسجيل الإكسباير','view.expiry'],['replacement','♻️','الاستبدال','view.replacement'],['purchases','🛒','استلام المشتريات','view.purchases'],['reports','📊','مركز التقارير','view.reports'],['products','🏷️','الأصناف','view.products'],['users','👥','المستخدمون','view.users'],['audit','🛡️','سجل الرقابة','view.audit'],['settings','⚙️','الإعدادات','view.settings']
];
function allowedNav(){return nav.filter(x=>hasPerm(x[3])||currentUser?.role==='مدير')}
function pageTitle(){const n=nav.find(x=>x[0]===route);return n?.[2]||'مستودع الإكسباير'}
function loginView(){return `<section class="login"><div class="login-card"><div class="login-logo">🌾</div><h1>مستودع الإكسباير</h1><p>سنابل مارت — Cloud V5</p><input id="pin" class="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"><button id="loginBtn" class="btn primary wide" style="margin-top:12px;height:52px">دخول</button><div class="note" style="margin-top:14px;text-align:center">المزامنة مباشرة مع Supabase — نفس البيانات على كل الأجهزة.</div></div></section>`}

function supplierExpiryRanking(){
 const map=new Map();
 for(const e of st.expiry){
  const supplier=String(e.supplier||'مورد عام').trim()||'مورد عام';
  if(!map.has(supplier))map.set(supplier,{supplier,expired:0,remaining:0,value:0,replaced:0,operations:0});
  const x=map.get(supplier);
  x.expired+=num(e.qty);x.remaining+=num(e.remaining);x.value+=num(e.remaining)*num(e.cost);x.operations++;
 }
 for(const x of map.values())x.replaced=Math.max(0,x.expired-x.remaining);
 return [...map.values()].sort((a,b)=>b.expired-a.expired||b.value-a.value||a.supplier.localeCompare(b.supplier,'ar'));
}
function topSuppliersHtml(limit=5){
 const rows=supplierExpiryRanking().slice(0,limit);
 if(!rows.length)return '<div class="empty">لا توجد بيانات إكسباير حتى الآن</div>';
 return `<div class="supplier-rank-list">${rows.map((x,i)=>`<div class="supplier-rank-row">
 <div class="supplier-rank-no">${i+1}</div><div class="supplier-rank-name">${esc(x.supplier)}</div>
 <div class="supplier-rank-metric"><small>إجمالي الإكسباير</small><b>${x.expired}</b></div>
 <div class="supplier-rank-metric"><small>المستبدل</small><b>${x.replaced}</b></div>
 <div class="supplier-rank-metric"><small>المتبقي</small><b>${x.remaining}</b></div>
 <div class="supplier-rank-metric"><small>قيمة المتبقي</small><b>${money(x.value)} ر.س</b></div>
 </div>`).join('')}</div>`;
}

function miniExpiry(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الباركود</th><th>الكمية</th><th>المتبقي</th><th>الوقت</th><th>المستخدم</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.productName||getProduct(x.productId)?.name||'—')}</td><td>${esc(x.barcode||getProduct(x.productId)?.barcode||'—')}</td><td>${num(x.qty)}</td><td>${num(x.remaining)}</td><td>${esc(operationTime(x))}</td><td>${esc(x.user||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد عمليات</div>'}
function miniRepl(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الباركود</th><th>المستبدل</th><th>الوقت</th><th>المستخدم</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.productName||getProduct(x.productId)?.name||'—')}</td><td>${esc(x.barcode||getProduct(x.productId)?.barcode||'—')}</td><td>${num(x.qty)}</td><td>${esc(operationTime(x))}</td><td>${esc(x.user||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد استبدالات</div>'}
function supplierOptions(v=''){return suppliers().map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function normalizeSupplierText(v){return String(v||'').trim().toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\u0600-\u06FFa-z0-9 ]/gi,' ').replace(/\s+/g,' ').trim()}
function bestSupplierMatch(q){
 const nq=normalizeSupplierText(q);if(!nq)return null;
 const words=nq.split(' ').filter(Boolean);
 const rows=suppliers().map(name=>({name,n:normalizeSupplierText(name)}));
 const score=x=>{
  if(x.n===nq)return 0;
  if(x.n.startsWith(nq))return 10+x.n.length/1000;
  const wordStart=x.n.split(' ').some(w=>w.startsWith(nq));if(wordStart)return 20+x.n.length/1000;
  const at=x.n.indexOf(nq);if(at>=0)return 30+at+x.n.length/1000;
  if(words.length&&words.every(w=>x.n.includes(w)))return 50+x.n.length/1000;
  return 999999;
 };
 const ranked=rows.map(x=>({...x,s:score(x)})).filter(x=>x.s<999999).sort((a,b)=>a.s-b.s||a.name.localeCompare(b.name,'ar'));
 return ranked[0]?.name||null;
}
function supplierLookupField(id,label='المورد',initial=''){return `<div class="field lookup supplier-lookup"><label>${label}</label><input id="${id}" autocomplete="off" value="${esc(initial)}" placeholder="اكتب جزءًا من اسم المورد"><div id="${id}Sug" class="suggestions hidden"></div><small id="${id}Hint" class="muted">مثال: اكتب «المراعي» أو جزءًا من الاسم.</small></div>`}
function bindSupplierLookup(id,onPick){
 const input=$('#'+id),box=$('#'+id+'Sug'),hint=$('#'+id+'Hint');if(!input||!box)return;
 let selected='';
 const choose=name=>{selected=name||'';input.value=selected;box.classList.add('hidden');if(hint)hint.innerHTML=selected?`<span style="color:#18794e;font-weight:900">✓ تم اختيار: ${esc(selected)}</span>`:'اكتب جزءًا من اسم المورد';onPick?.(selected)};
 const draw=()=>{
  selected='';
  const q=input.value.trim();
  if(!q){box.classList.add('hidden');if(hint)hint.textContent='اكتب جزءًا من اسم المورد وسيظهر مورد واحد فقط.';return}
  const best=bestSupplierMatch(q);
  if(!best){box.classList.add('hidden');if(hint)hint.innerHTML='<span style="color:#991b1b;font-weight:800">لا يوجد مورد مطابق</span>';return}
  box.innerHTML=`<button type="button" data-supplier-choice="${esc(best)}"><b>${esc(best)}</b><small>النتيجة الأقرب — اضغط للاختيار</small></button>`;
  box.classList.remove('hidden');
  if(hint)hint.textContent='ظهر أفضل مورد مطابق فقط.';
 };
 input.addEventListener('focus',()=>{input.select();draw()});
 input.addEventListener('input',draw);
 input.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Tab'){const best=bestSupplierMatch(input.value);if(best){if(e.key==='Enter')e.preventDefault();choose(best)}}});
 input.addEventListener('blur',()=>setTimeout(()=>{const best=bestSupplierMatch(input.value);if(best)choose(best);else box.classList.add('hidden')},180));
 box.addEventListener('mousedown',e=>{const b=e.target.closest('[data-supplier-choice]');if(b){e.preventDefault();choose(b.dataset.supplierChoice)}});
 if(input.value.trim()){const exact=bestSupplierMatch(input.value);if(exact&&normalizeSupplierText(exact)===normalizeSupplierText(input.value))selected=exact}
 input._selectedSupplier=()=>selected||bestSupplierMatch(input.value)||'';
}
function selectedSupplier(id){const input=$('#'+id);return input?((typeof input._selectedSupplier==='function'&&input._selectedSupplier())||bestSupplierMatch(input.value)||''):''}
function lookupField(id,label){return `<div class="field span-2 lookup"><label>${label}</label><input id="${id}" autocomplete="off" placeholder="الباركود أو آخر الأرقام أو اسم الصنف"><div id="${id}Sug" class="suggestions hidden"></div></div>`}

function workerLastExpiryRows(limit=7){
 if(!currentUser)return [];
 const uid=String(currentUser.id||'');

 return st.expiry
  .filter(x=>{
    if(x.userId!=null && uid)return String(x.userId)===uid;
    return String(x.user||'').trim()===uname;
  })
  .sort((a,b)=>String(b.createdAt||b.at||'').localeCompare(String(a.createdAt||a.at||'')))
  .slice(0,limit);
}

function reportSupplierHtml(sup){
 const rows=stockRows().map(x=>{const ex=st.expiry.filter(e=>String(e.productId)===String(x.p.id)&&String(e.supplier||'مورد عام')===String(sup));if(!ex.length)return null;const original=ex.reduce((a,e)=>a+num(e.qty),0),remaining=ex.reduce((a,e)=>a+num(e.remaining),0),value=ex.reduce((a,e)=>a+num(e.remaining)*num(e.cost),0);return {p:x.p,original,remaining,replaced:original-remaining,value}}).filter(Boolean);
 return reportTable(rows,`تقرير المورد: ${esc(sup)}`)

function localDateFromIso(v){
 if(!v)return '';
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return String(v).slice(0,10);
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function localTimeFromIso(v){
 if(!v)return '';
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return '';
 return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function operationDate(x){return localDateFromIso(x?.createdAt||x?.at||'')||String(x?.date||'').slice(0,10)}
function operationTime(x){return x?.operationTime||localTimeFromIso(x?.createdAt||x?.at||'')||'—'}
function recordInRange(x,from,to){
 const d=operationDate(x);
 return (!from||d>=from)&&(!to||d<=to);
}
function yesterdayDate(){
 const d=new Date();d.setDate(d.getDate()-1);
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}

 return rest(`${T.expiry}?product_id=eq.${encodeURIComponent(productId)}&select=id,remaining,expiry_date,created_at,payload&order=expiry_date.asc,created_at.asc`)
}
async function rewriteReplacementAllocation(rec,newQty,newSupplier){
 const rows=await replacementCloudBatches(rec.productId);
 const original=new Map(rows.map(r=>[String(r.id),{remaining:num(r.remaining),payload:r.payload||{}}]));
 const working=new Map(rows.map(r=>[String(r.id),{...r,remaining:num(r.remaining)}]));
 // Restore old allocation first.
 for(const a of (rec.allocations||[])){const row=working.get(String(a.expiryId));if(row)row.remaining+=num(a.qty)}
 const ns=normalizeSupplierText(newSupplier);
 const candidates=[...working.values()].filter(r=>normalizeSupplierText(r.payload?.supplier||'مورد عام')===ns).sort((a,b)=>String(a.expiry_date||'9999').localeCompare(String(b.expiry_date||'9999'))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
 const total=candidates.reduce((a,r)=>a+num(r.remaining),0);if(newQty>total)throw new Error(`رصيد المورد «${newSupplier}» المتاح ${total} فقط`);
 let left=newQty,newAlloc=[];
 for(const r of candidates){if(left<=0)break;const take=Math.min(left,num(r.remaining));if(take>0){r.remaining-=take;newAlloc.push({expiryId:r.id,qty:take});left-=take}}
 const touched=[...working.values()].filter(r=>original.has(String(r.id))&&num(r.remaining)!==num(original.get(String(r.id)).remaining));
 const changed=[];
 try{
  for(const r of touched){const old=original.get(String(r.id));await patch(T.expiry,r.id,{remaining:num(r.remaining),payload:{...(r.payload||{}),remaining:num(r.remaining)},updated_at:now(),updated_by:currentUser.name});changed.push({id:r.id,old})}
 }catch(e){
  for(const c of changed){try{await patch(T.expiry,c.id,{remaining:c.old.remaining,payload:{...c.old.payload,remaining:c.old.remaining},updated_at:now(),updated_by:currentUser.name})}catch{}}
  throw e
 }
 return {allocations:newAlloc,touched}
}

 }catch(e){setCloud('bad','فشل استيراد الأصناف');toast(e.message)}
}
function userModal(u=null){const x=u||{id:uid('u'),name:'',pin:'',role:'عامل',active:true};modal(u?'تعديل مستخدم':'إضافة مستخدم',`<div class="form-grid"><div class="field"><label>الاسم</label><input id="uName" value="${esc(x.name)}"></div><div class="field"><label>PIN</label><input id="uPin" inputmode="numeric" value="${esc(x.pin)}"></div><div class="field"><label>الدور</label><select id="uRole"><option ${x.role==='عامل'?'selected':''}>عامل</option><option ${x.role==='مشرف'?'selected':''}>مشرف</option><option ${x.role==='مدير'?'selected':''}>مدير</option></select></div><div class="field"><label>الحالة</label><select id="uActive"><option value="1" ${x.active!==false?'selected':''}>نشط</option><option value="0" ${x.active===false?'selected':''}>موقوف</option></select></div></div><button id="saveUser" class="btn primary wide" style="margin-top:14px">حفظ</button>`,()=>{$('#saveUser').onclick=async()=>{const next={...x,name:$('#uName').value.trim(),pin:$('#uPin').value.trim(),role:$('#uRole').value,active:$('#uActive').value==='1'};if(!next.name||!next.pin)return toast('أدخل الاسم والرقم السري');await upsert(T.users,next,{name:next.name,pin:next.pin,role:next.role,active:next.active});upsertLocal(st.users,next);await audit(u?'تعديل مستخدم':'إضافة مستخدم',next.name);$('#modalRoot').innerHTML='';render()}})}
function bindUsers(){$('#newUser').onclick=()=>userModal();$('#page').onclick=e=>{const b=e.target.closest('[data-edit-user]');if(b)userModal(st.users.find(x=>String(x.id)===String(b.dataset.editUser)))}}
function download(name,content,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function bindSettings(){
 $('#saveSettings').onclick=async()=>{const next={...st.settings,business:$('#business').value.trim(),suppliers:$('#supplierText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)};await rest(`${T.settings}?on_conflict=id`,{method:'POST',body:[{id:'main',payload:next,updated_at:now(),updated_by:currentUser.name}],prefer:'resolution=merge-duplicates'});st.settings=next;await audit('تعديل الإعدادات');toast('تم الحفظ على السحابة');render()};
 $('#backupBtn').onclick=()=>download(`expiry_v5_backup_${today()}.json`,JSON.stringify(st,null,2));
 $('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>restoreBackup(e.target.files[0]);
}
async function restoreBackup(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.products)||!Array.isArray(d.expiry))throw new Error('ملف غير صالح');if(!confirm('سيتم دمج النسخة مع السحابة بدون حذف البيانات الحالية. متابعة؟'))return;setCloud('busy','جاري دمج النسخة…');const pushMany=async(table,rows,extraFn)=>{for(let i=0;i<rows.length;i+=150){const part=rows.slice(i,i+150).map(x=>({id:String(x.id),payload:x,updated_at:now(),updated_by:currentUser.name,...(extraFn?extraFn(x):{})}));await rest(`${table}?on_conflict=id`,{method:'POST',body:part,prefer:'resolution=merge-duplicates'})}};await pushMany(T.products,d.products,p=>({smart_code:p.smartCode||null,barcode:p.barcode||null,name:p.name||'',cost:num(p.cost),category:p.category||null}));await pushMany(T.expiry,d.expiry,x=>({product_id:String(x.productId),qty:num(x.qty),remaining:num(x.remaining),cost:num(x.cost),expiry_date:x.expiryDate||null,created_at:x.createdAt||now()}));await pushMany(T.replacements,d.replacements||[],x=>({product_id:String(x.productId),qty:num(x.qty),created_at:x.createdAt||now()}));await loadCloud();await audit('استعادة نسخة احتياطية','دمج سحابي');toast('تم دمج النسخة مع السحابة بنجاح')}catch(e){setCloud('bad','فشل الاستعادة');toast(e.message)}}
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('sw.js?v=507',{updateViaCache:'none'});await reg.update()}catch(e){console.warn('SW update skipped',e)}});
if('caches' in window){
  caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('expiry-v5-')&&k!=='expiry-v5-507').map(k=>caches.delete(k)))).catch(()=>{});
}
render();loadCloud().then(setupRealtime).catch(e=>{console.error(e);setCloud('bad','تعذر الاتصال بالسحابة');render()});
})();
</script>
</body>
</html>
