async function upsertRows(table,rows,{batchSize=80,onProgress=null,retries=4}={}){
 if(!rows.length)return;
 for(let i=0;i<rows.length;i+=batchSize){
  const batch=rows.slice(i,i+batchSize);let lastErr=null;
  for(let attempt=0;attempt<=retries;attempt++){
   try{
    await rest(`${table}?on_conflict=id`,{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(batch)});
    lastErr=null;break;
   }catch(err){
    lastErr=err;
    if(attempt>=retries)break;
    setCloudStatus('busy',`إعادة محاولة الرفع ${attempt+1}/${retries}…`);
    await sleep(700*Math.pow(2,attempt));
   }
  }
  if(lastErr)throw new Error(`تعذر رفع الدفعة ${Math.floor(i/batchSize)+1}: ${lastErr.message||lastErr}`);
  onProgress?.(Math.min(i+batch.length,rows.length),rows.length);
  if(i+batch.length<rows.length)await sleep(70);
 }
}

function rowBase(x){return {id:String(x.id),payload:x,updated_at:now(),updated_by:currentUser?.name||'النظام'}}
async function cloudPush(){
 if(cloudBusy)return scheduleCloudPush(); cloudBusy=true; setCloudStatus('busy','جاري الحفظ…');
 try{
  const jobs=[];
  if(productsNeedSync){jobs.push(upsertRows(CLOUD_TABLES.products,db.products.map(p=>Object.assign(rowBase(p),{smart_code:p.smartCode||null,barcode:p.barcode||null,name:p.name||'',cost:num(p.cost),category:p.category||null})),{batchSize:250}))}
  jobs.push(
   upsertRows(CLOUD_TABLES.expiry,db.expiry.map(x=>Object.assign(rowBase(x),{product_id:String(x.productId),qty:num(x.qty),remaining:num(x.remaining),cost:num(x.cost),expiry_date:x.expiryDate||null,created_at:x.createdAt||x.at||now()}))),
   upsertRows(CLOUD_TABLES.replacements,db.replacements.map(x=>Object.assign(rowBase(x),{product_id:String(x.productId),qty:num(x.qty),created_at:x.createdAt||x.at||now()}))),
   upsertRows(CLOUD_TABLES.purchases,db.purchases.map(x=>Object.assign(rowBase(x),{number:x.number||null,supplier:x.supplier||'مورد عام',purchase_date:x.date||dateOnly(),created_at:x.createdAt||now()}))),
   upsertRows(CLOUD_TABLES.purchaseItems,db.purchases.flatMap(p=>(p.items||[]).map((i,n)=>{const iid=i.id||`${p.id}_${n}`;i.id=iid;return Object.assign(rowBase(i),{id:iid,purchase_id:String(p.id),product_id:String(i.productId),qty:num(i.qty),cost:num(i.cost)})}))),
   upsertRows(CLOUD_TABLES.users,db.users.map(u=>Object.assign(rowBase(u),{name:u.name||'',pin:u.pin||'',role:u.role||'عامل',active:u.active!==false}))),
   upsertRows(CLOUD_TABLES.audit,db.audit.slice(0,500).map(a=>Object.assign(rowBase(a),{action:a.action||'',detail:a.detail||null,user_name:a.user||null,created_at:a.at||now()}))),
   upsertRows(CLOUD_TABLES.settings,[{id:'main',payload:db.settings,updated_at:now(),updated_by:currentUser?.name||'النظام'}])
  );
  await Promise.all(jobs);productsNeedSync=false;cloudDirty=false;setCloudStatus('ok','متزامن');
 }catch(err){console.error('Cloud push failed',err);setCloudStatus('error','فشل الحفظ السحابي');clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudPush(),6000)}finally{cloudBusy=false}
}
function mergeById(localRows,cloudRows){
 const map=new Map();
 for(const row of (localRows||[])){if(row&&row.id!=null)map.set(String(row.id),row)}
 for(const row of (cloudRows||[])){if(row&&row.id!=null)map.set(String(row.id),Object.assign({},map.get(String(row.id))||{},row))}
 return [...map.values()]
}

function upsertLocalById(arr,obj){const i=arr.findIndex(x=>String(x.id)===String(obj.id));if(i>=0)arr[i]=Object.assign({},arr[i],obj);else arr.unshift(obj)}
function applyRealtimeChange(table,payload){
 try{const evt=payload?.eventType||payload?.event,row=payload?.new||{},old=payload?.old||{},obj=row?.payload;if(row?.updated_by&&row.updated_by===currentUser?.name)return;const del=(arr,idv)=>{const i=arr.findIndex(x=>String(x.id)===String(idv));if(i>=0)arr.splice(i,1)};
  if(table===CLOUD_TABLES.products){if(evt==='DELETE')del(db.products,old.id);else if(obj)upsertLocalById(db.products,obj);invalidateCaches()}
  else if(table===CLOUD_TABLES.expiry){if(evt==='DELETE')del(db.expiry,old.id);else if(obj)upsertLocalById(db.expiry,obj);invalidateCaches()}
  else if(table===CLOUD_TABLES.replacements){if(evt==='DELETE')del(db.replacements,old.id);else if(obj)upsertLocalById(db.replacements,obj)}
  else if(table===CLOUD_TABLES.users){if(evt==='DELETE')del(db.users,old.id);else if(obj)upsertLocalById(db.users,obj)}
  else if(table===CLOUD_TABLES.settings&&obj){db.settings=Object.assign({},db.settings,obj)}else return;
  saveLocal();const editing=['expiry','replacement','purchases'].includes(currentRoute)||!!document.querySelector('.modal-wrap');if(currentUser&&!editing)render();
 }catch(e){console.warn('Realtime apply failed',e)}
}
async function cloudPull({silent=false}={}){
 if(cloudDirty&&!cloudBusy){await cloudPush();if(cloudDirty)return false}
 if(!silent)setCloudStatus('busy','جاري تحميل السحابة…');
 try{
  const [products,expiry,replacements,purchases,pItems,users,auditRows,settings]=await Promise.all([
   fetchAllRows(CLOUD_TABLES.products,'payload','updated_at.desc'),
   rest(`${CLOUD_TABLES.expiry}?select=payload&order=created_at.desc`),
   rest(`${CLOUD_TABLES.replacements}?select=payload&order=created_at.desc`),
   rest(`${CLOUD_TABLES.purchases}?select=payload&order=created_at.desc`),
   rest(`${CLOUD_TABLES.purchaseItems}?select=purchase_id,payload&order=updated_at.asc`),
   rest(`${CLOUD_TABLES.users}?select=payload&order=updated_at.asc`),
   rest(`${CLOUD_TABLES.audit}?select=payload&order=created_at.desc&limit=1000`),
   rest(`${CLOUD_TABLES.settings}?id=eq.main&select=payload`)
  ]);
  const cloudProducts=products.map(r=>r.payload).filter(Boolean);cloudStats.cloudProducts=cloudProducts.length;cloudStats.localProducts=db.products.length;cloudStats.lastChecked=now();cloudStats.status='ok';cloudStats.error='';
  const cloudExpiry=expiry.map(r=>r.payload).filter(Boolean);
  const cloudReplacements=replacements.map(r=>r.payload).filter(Boolean);
  const cloudUsers=users.map(r=>r.payload).filter(Boolean);
  const cloudAudit=auditRows.map(r=>r.payload).filter(Boolean);
  const itemsByPurchase=new Map();
  for(const r of pItems){if(!itemsByPurchase.has(String(r.purchase_id)))itemsByPurchase.set(String(r.purchase_id),[]);if(r.payload)itemsByPurchase.get(String(r.purchase_id)).push(r.payload)}
  const cloudPurchases=purchases.map(r=>r.payload).filter(Boolean).map(x=>Object.assign({},x,{items:itemsByPurchase.get(String(x.id))||x.items||[]}));

  suppressCloudPush=true;
  // دمج آمن: لا تمسح السحابة الفارغة بيانات الجهاز.
  db.settings=Object.assign({},defaultDB.settings,db.settings||{},settings[0]?.payload||{});
  db.users=cloudUsers.length?cloudUsers:db.users;
  db.products=cloudProducts;
  db.expiry=cloudExpiry;
  db.replacements=cloudReplacements;
  db.purchases=cloudPurchases;
  db.audit=mergeById(db.audit,cloudAudit).sort((a,b)=>String(b.at||b.createdAt||'').localeCompare(String(a.at||a.createdAt||''))).slice(0,1000);
  if(!db.users.length)db.users=structuredClone(defaultDB.users);
  db.products=db.products.map(p=>Object.assign({unit:'حبة',unitCode:db.settings.defaultUnitCode||'u01',taxRate:'15%',salePrice:0,category:''},p));
  saveLocal();suppressCloudPush=false;

  // إذا كان الجهاز يملك أصنافًا أكثر من السحابة، ارفعها ولا تحذفها.
  if(db.products.length>cloudProducts.length && Date.now()-lastLocalMutationAt<120000){cloudDirty=true;scheduleCloudPush()}
  if(currentUser){const refreshed=db.users.find(u=>u.id===currentUser.id)||db.users.find(u=>u.pin===currentUser.pin);if(refreshed)currentUser=refreshed;render()}
  setCloudStatus('ok','متزامن');return true
 }catch(err){suppressCloudPush=false;console.error('Cloud pull failed',err);setCloudStatus('error','وضع محلي');return false}
}

function setupRealtime(){
 try{if(!window.supabase?.createClient){setCloudStatus('ok','متزامن يدويًا');return}const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});if(realtimeChannel)try{client.removeChannel(realtimeChannel)}catch{}realtimeChannel=client.channel('expiry-live-v48');const tables=[CLOUD_TABLES.products,CLOUD_TABLES.expiry,CLOUD_TABLES.replacements,CLOUD_TABLES.users,CLOUD_TABLES.settings];tables.forEach(table=>realtimeChannel.on('postgres_changes',{event:'*',schema:'public',table},payload=>applyRealtimeChange(table,payload)));realtimeChannel.subscribe(status=>{if(status==='SUBSCRIBED')setCloudStatus('ok','متزامن لحظيًا');else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setCloudStatus('error','متزامن يدويًا')})}catch(err){console.error('Realtime setup failed',err);setCloudStatus('ok','متزامن يدويًا')}
}

function barcodeField(inputId,placeholder='اكتب أو امسح الباركود'){return `<div class="barcode-entry"><input id="${inputId}" autocomplete="off" inputmode="numeric" placeholder="${placeholder}"><button type="button" class="btn secondary barcode-find" data-barcode-find="${inputId}">بحث</button><button type="button" class="btn primary scan-camera" data-scan-target="${inputId}" aria-label="فتح كاميرا الباركود">📷</button></div><small class="barcode-help">يدعم الإدخال اليدوي، قارئ الباركود الخارجي، وكاميرا الجوال.</small>`}
function beepScan(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1100;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}catch(e){}try{navigator.vibrate?.(120)}catch(e){}}
async function startBarcodeScanner(targetInput,onScanned){const root=$('#scannerRoot');if(!root)return;closeBarcodeScanner();root.innerHTML=`<div class="scanner-wrap"><section class="scanner-panel"><div class="scanner-head"><h3>مسح الباركود بالكاميرا</h3><button type="button" class="scanner-close">×</button></div><div class="scanner-stage"><video id="barcodeVideo" playsinline muted></video><div class="scanner-frame"></div><div class="scanner-line"></div></div><div id="scannerStatus" class="scanner-status">وجّه الكاميرا نحو الباركود وثبّت الجوال قليلًا…</div><div class="scanner-actions"><button type="button" id="scannerTorch">تشغيل الفلاش</button><label id="scannerZoomWrap" class="scanner-range hidden">تكبير <input id="scannerZoom" type="range" step="0.1"></label><button type="button" id="scannerManual">إدخال يدوي</button></div><div id="scannerManualBox" class="scanner-fallback hidden"><label>أدخل رقم الباركود</label><input id="scannerManualInput" inputmode="numeric"><button type="button" id="scannerUseManual" class="btn primary" style="margin-top:10px">اعتماد الرقم</button></div></section></div>`;
 const wrap=root.querySelector('.scanner-wrap'),video=$('#barcodeVideo'),status=$('#scannerStatus');let stream=null,stopped=false,detector=null,raf=0,last='';
 const finish=value=>{value=String(value||'').trim();if(!value||value===last)return;last=value;beepScan();if(targetInput)targetInput.value=value;closeBarcodeScanner();onScanned?.(value)};
 const cleanup=()=>{stopped=true;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop())};activeScannerCleanup=cleanup;
 wrap.addEventListener('click',e=>{if(e.target===wrap||e.target.closest('.scanner-close'))closeBarcodeScanner()});
 $('#scannerManual').onclick=()=>{$('#scannerManualBox').classList.toggle('hidden');$('#scannerManualInput').focus()};$('#scannerUseManual').onclick=()=>finish($('#scannerManualInput').value);$('#scannerManualInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(e.currentTarget.value)}};
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30},advanced:[{focusMode:'continuous'}]},audio:false});video.srcObject=stream;await video.play();const track=stream.getVideoTracks()[0],caps=track.getCapabilities?.()||{};
  if(caps.torch){$('#scannerTorch').onclick=async()=>{const on=$('#scannerTorch').dataset.on!=='1';try{await track.applyConstraints({advanced:[{torch:on}]});$('#scannerTorch').dataset.on=on?'1':'0';$('#scannerTorch').textContent=on?'إطفاء الفلاش':'تشغيل الفلاش'}catch(e){toast('الفلاش غير مدعوم على هذا الجهاز')}}}else $('#scannerTorch').classList.add('hidden');
  if(caps.zoom){const z=$('#scannerZoom'),zw=$('#scannerZoomWrap');zw.classList.remove('hidden');z.min=caps.zoom.min;z.max=caps.zoom.max;z.value=track.getSettings().zoom||caps.zoom.min;z.oninput=()=>track.applyConstraints({advanced:[{zoom:Number(z.value)}]}).catch(()=>{})}
  if('BarcodeDetector' in window){const formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];try{detector=new BarcodeDetector({formats});}catch(e){detector=new BarcodeDetector()}const loop=async()=>{if(stopped)return;try{const codes=await detector.detect(video);if(codes?.[0]?.rawValue)return finish(codes[0].rawValue)}catch(e){}raf=requestAnimationFrame(loop)};loop()}else{status.textContent='جاري تحميل قارئ الكاميرا المتوافق مع جهازك…';await loadHtml5Qrcode();cleanup();activeScannerCleanup=null;root.innerHTML='';startHtml5BarcodeScanner(targetInput,onScanned)}
 }catch(err){console.error(err);status.textContent='تعذر تشغيل الكاميرا. اسمح للمتصفح باستخدام الكاميرا أو استخدم الإدخال اليدوي.';$('#scannerManualBox').classList.remove('hidden');$('#scannerManualInput').focus()}}
function loadHtml5Qrcode(){if(window.Html5Qrcode)return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل قارئ الكاميرا'));document.head.appendChild(s)})}
async function startHtml5BarcodeScanner(targetInput,onScanned){const root=$('#scannerRoot');root.innerHTML=`<div class="scanner-wrap"><section class="scanner-panel"><div class="scanner-head"><h3>مسح الباركود بالكاميرا</h3><button type="button" class="scanner-close">×</button></div><div id="html5Reader" style="background:#fff;border-radius:14px;overflow:hidden"></div><div class="scanner-status">وجّه الكاميرا نحو الباركود</div></section></div>`;let scanner=new Html5Qrcode('html5Reader');activeScannerCleanup=()=>scanner.stop().catch(()=>{});root.querySelector('.scanner-close').onclick=closeBarcodeScanner;try{await scanner.start({facingMode:'environment'},{fps:15,qrbox:{width:300,height:130},aspectRatio:1.333,formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39]},code=>{beepScan();if(targetInput)targetInput.value=code;closeBarcodeScanner();onScanned?.(code)},()=>{})}catch(e){toast('تعذر تشغيل الكاميرا');closeBarcodeScanner()}}
function bindBarcodeControls(input,resolve,{autoAdd=false}={}){
 if(!input)return;
 let autoTimer=null;
 const run=()=>{clearTimeout(autoTimer);resolve?.(input.value.trim(),{autoAdd})};
 input.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='Tab'){
   if(input.value.trim()){e.preventDefault();run()}
  }
 });
 input.addEventListener('input',()=>{
  clearTimeout(autoTimer);
  const v=input.value.trim();
  if(/^\d{6,20}$/.test(v)) autoTimer=setTimeout(run,120);
 });
 const container=input.closest('.field')||input.parentElement;
 container?.querySelector(`[data-barcode-find="${input.id}"]`)?.addEventListener('click',run);
 container?.querySelector(`[data-scan-target="${input.id}"]`)?.addEventListener('click',()=>startBarcodeScanner(input,()=>resolve?.(input.value.trim(),{autoAdd:true})));
}
function ensureProductCache(){if(productExactCache)return;productExactCache=new Map();for(const p of db.products){if(p.barcode)productExactCache.set(String(p.barcode),p);if(p.smartCode)productExactCache.set(String(p.smartCode),p)}}
function productByQuery(q){q=String(q||'').trim();if(!q)return null;ensureProductCache();const exact=productExactCache.get(q);if(exact)return exact;const nq=q.toLowerCase();return db.products.find(p=>String(p.barcode||'').endsWith(q)||String(p.smartCode||'').endsWith(q)||String(p.name||'').toLowerCase().includes(nq))||null}
function ensureStockCache(){if(stockCache)return;stockCache=new Map();for(const x of db.expiry){stockCache.set(x.productId,(stockCache.get(x.productId)||0)+num(x.remaining))}}
function availableQty(pid){ensureStockCache();return stockCache.get(pid)||0}

function defaultPermissionsForRole(role){
 const all=Object.fromEntries(PERMISSION_DEFS.map(([k])=>[k,true]));
 if(role==='مدير')return all;
 const p=Object.fromEntries(PERMISSION_DEFS.map(([k])=>[k,false]));
 p['view.dashboard']=true;
 if(role==='مشرف'){
  ['view.expiry','expiry.add','expiry.edit','view.replacement','replacement.add','replacement.edit','view.purchases','purchases.add','purchases.review','purchases.approve','purchases.export','purchases.whatsapp','view.reports','reports.print'].forEach(k=>p[k]=true);
 }else{
  ['view.expiry','expiry.add','view.replacement','replacement.add','view.purchases','purchases.add'].forEach(k=>p[k]=true);
 }
 return p
}
function effectivePermissions(user=currentUser){

function bindSupplierCombo(input,onPick){if(!input)return;const box=input.closest('.supplier-combo'),list=box?.querySelector('.supplier-suggestions');if(!box||!list)return;let active=-1,shown=[];const allowEmpty=input.dataset.allowEmpty==='1';const render=()=>{const q=String(input.value||'').trim().toLowerCase();shown=supplierNames().filter(x=>!q||x.toLowerCase().includes(q)).slice(0,40);active=-1;list.innerHTML=shown.length?shown.map((x,i)=>`<button type="button" class="supplier-option" data-supplier-index="${i}">${esc(x)}</button>`).join(''):`<div class="supplier-empty">لا يوجد مورد مطابق</div>`;list.classList.add('open')};const choose=i=>{const v=shown[i];if(!v)return;input.value=v;list.classList.remove('open');active=-1;if(onPick)onPick(v)};input.addEventListener('focus',render);input.addEventListener('input',render);input.addEventListener('keydown',e=>{if(!list.classList.contains('open'))return;if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,shown.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0)}else if(e.key==='Enter'&&shown.length){e.preventDefault();choose(active>=0?active:0);return}else if(e.key==='Escape'){list.classList.remove('open');return}else return;[...list.querySelectorAll('.supplier-option')].forEach((b,i)=>b.classList.toggle('active',i===active));if(active>=0)list.querySelectorAll('.supplier-option')[active]?.scrollIntoView({block:'nearest'})});list.addEventListener('mousedown',e=>{const b=e.target.closest('[data-supplier-index]');if(b){e.preventDefault();choose(Number(b.dataset.supplierIndex))}});input.addEventListener('blur',()=>setTimeout(()=>{list.classList.remove('open');if(!allowEmpty&&!String(input.value||'').trim())input.value='مورد عام'},120))}

async function deleteExpiryRecord(rec){if(!hasPerm('expiry.delete')||!rec)return toast('ليس لديك صلاحية الحذف');if(!confirm(`حذف عملية الإكسباير للصنف «${rec.productName||'الصنف'}»؟
سيتم تحديث الرصيد والتقارير مباشرة.`))return;const idx=db.expiry.findIndex(x=>x.id===rec.id);if(idx<0)return;const snapshot={...rec};db.expiry.splice(idx,1);try{recalcProductFIFO(rec.productId)}catch(err){db.expiry.splice(idx,0,snapshot);recalcProductFIFO(rec.productId);return toast('لا يمكن حذف العملية لأنها مرتبطة بكمية مستبدلة لا يمكن تغطيتها من سجلات أخرى')};try{await deleteCloudRow(CLOUD_TABLES.expiry,snapshot.id)}catch(err){db.expiry.splice(idx,0,snapshot);recalcProductFIFO(rec.productId);saveLocal();return toast('تعذر الحذف من السحابة — لم يتم حذف العملية')};audit('حذف عملية إكسباير',`${snapshot.productName||''} — الكمية ${snapshot.qty} — المورد ${snapshot.supplier||'مورد عام'}`);render();toast('تم حذف عملية الإكسباير من جميع الأجهزة')}
async function deleteReplacementRecord(rec){if(!hasPerm('replacement.delete')||!rec)return toast('ليس لديك صلاحية الحذف');if(!confirm(`حذف عملية الاستبدال للصنف «${rec.productName||'الصنف'}»؟
سيتم إعادة الكمية إلى رصيد الإكسباير.`))return;const idx=db.replacements.findIndex(x=>x.id===rec.id);if(idx<0)return;const snapshot={...rec,allocations:Array.isArray(rec.allocations)?rec.allocations.map(a=>({...a})):[]};db.replacements.splice(idx,1);try{recalcProductFIFO(rec.productId)}catch(err){db.replacements.splice(idx,0,snapshot);recalcProductFIFO(rec.productId);return toast('تعذر حذف عملية الاستبدال')};try{await deleteCloudRow(CLOUD_TABLES.replacements,snapshot.id)}catch(err){db.replacements.splice(idx,0,snapshot);recalcProductFIFO(rec.productId);saveLocal();return toast('تعذر الحذف من السحابة — لم يتم حذف العملية')};audit('حذف عملية استبدال',`${snapshot.productName||''} — الكمية ${snapshot.qty} — المورد ${snapshot.supplier||'مورد عام'}`);render();toast('تم حذف عملية الاستبدال من جميع الأجهزة وإعادة الكمية للرصيد')}
function recalcProductFIFO(productId){const ex=db.expiry.filter(x=>x.productId===productId).sort((a,b)=>String(a.expiryDate||a.createdAt||'').localeCompare(String(b.expiryDate||b.createdAt||'')));ex.forEach(x=>x.remaining=num(x.qty));const reps=db.replacements.filter(x=>x.productId===productId).sort((a,b)=>String(a.createdAt||a.date||'').localeCompare(String(b.createdAt||b.date||'')));for(const r of reps){let left=num(r.qty);r.allocations=[];for(const x of ex){if(left<=0)break;const take=Math.min(left,num(x.remaining));if(take>0){x.remaining-=take;left-=take;r.allocations.push({expiryId:x.id,qty:take})}}if(left>0)throw new Error('إجمالي الاستبدال أكبر من كمية الإكسباير المسجلة');if(!r.supplier||r.supplier==='مورد عام'){const ss=[...new Set(r.allocations.map(a=>db.expiry.find(e=>e.id===a.expiryId)?.supplier||'مورد عام'))];if(ss.length===1)r.supplier=ss[0]}}
invalidateCaches()}

function editExpiryModal(rec){if(!hasPerm('expiry.edit'))return toast('ليس لديك صلاحية التعديل');const p=db.products.find(x=>x.id===rec.productId);modal('تعديل عملية إكسباير',`<form id="editExpiryForm" class="form-grid"><div class="field span-2"><label>الصنف</label><input value="${esc(rec.productName||p?.name||'')}" readonly></div><div class="field"><label>الكمية</label><input id="editExpQty" type="number" min="1" value="${num(rec.qty)}" required></div><div class="field"><label>تاريخ الانتهاء</label><input id="editExpDate" type="date" value="${esc(rec.expiryDate||dateOnly())}" required></div><div class="field"><label>المورد</label>${supplierSelectMarkup('editExpSupplier',rec.supplier||'مورد عام')}</div><div class="field"><label>التكلفة</label><input id="editExpCost" type="number" step="0.0001" min="0" value="${num(rec.cost)}"></div><div class="field span-3"><label>ملاحظة</label><input id="editExpNote" value="${esc(rec.note||'')}"></div><div class="span-3"><button class="btn primary">حفظ التعديل</button></div></form>`,()=>{bindSupplierCombo($('#editExpSupplier'));$('#editExpiryForm').onsubmit=e=>{e.preventDefault();const old={qty:num(rec.qty),supplier:rec.supplier||'مورد عام',date:rec.expiryDate};const consumed=Math.max(0,num(rec.qty)-num(rec.remaining));const q=num($('#editExpQty').value);if(q<consumed)return toast(`لا يمكن جعل الكمية أقل من الكمية المستبدلة (${consumed})`);rec.qty=q;rec.expiryDate=$('#editExpDate').value;rec.supplier=$('#editExpSupplier').value||'مورد عام';rec.cost=num($('#editExpCost').value);rec.note=$('#editExpNote').value;try{recalcProductFIFO(rec.productId);propagateSupplierFromExpiry(rec.id)}catch(err){rec.qty=old.qty;rec.supplier=old.supplier;rec.expiryDate=old.date;recalcProductFIFO(rec.productId);return toast(err.message)}audit('تعديل عملية إكسباير',`${rec.productName||p?.name||''}: الكمية ${old.qty} ← ${rec.qty}، المورد ${old.supplier} ← ${rec.supplier}`);closeModal();render();toast('تم تعديل العملية')}})}

function supplierReportRows(supplier){const ex=db.expiry.filter(x=>!supplier||(x.supplier||'مورد عام')===supplier);const reps=db.replacements.filter(x=>!supplier||(x.supplier||'مورد عام')===supplier);const ids=new Set([...ex.map(x=>x.productId),...reps.map(x=>x.productId)]);return [...ids].map(pid=>{const p=db.products.find(x=>x.id===pid);const exs=ex.filter(x=>x.productId===pid),rs=reps.filter(x=>x.productId===pid);return {p,name:p?.name||exs[0]?.productName||rs[0]?.productName||'صنف غير معروف',barcode:p?.barcode||exs[0]?.barcode||rs[0]?.barcode||'',expired:exs.reduce((s,x)=>s+num(x.qty),0),replaced:rs.reduce((s,x)=>s+num(x.qty),0),remaining:exs.reduce((s,x)=>s+num(x.remaining),0),value:exs.reduce((s,x)=>s+num(x.remaining)*num(x.cost),0)}}).sort((a,b)=>b.value-a.value)}

function productReportData(productId){
 const p=db.products.find(x=>x.id===productId);
 if(!p)return null;
 const ex=db.expiry.filter(x=>x.productId===productId).sort((a,b)=>String(b.createdAt||b.expiryDate||'').localeCompare(String(a.createdAt||a.expiryDate||'')));
 const reps=db.replacements.filter(x=>x.productId===productId).sort((a,b)=>String(b.createdAt||b.date||'').localeCompare(String(a.createdAt||a.date||'')));
 const purchases=[];
 for(const pur of db.purchases||[]){for(const item of pur.items||[]){if(item.productId===productId)purchases.push({pur,item})}}
 purchases.sort((a,b)=>String(b.pur.createdAt||b.pur.date||'').localeCompare(String(a.pur.createdAt||a.pur.date||'')));
 const expired=ex.reduce((n,x)=>n+num(x.qty),0),replaced=reps.reduce((n,x)=>n+num(x.qty),0),remaining=ex.reduce((n,x)=>n+num(x.remaining),0),value=ex.reduce((n,x)=>n+num(x.remaining)*num(x.cost),0);
 const ops=[];
 ex.forEach(x=>ops.push({at:x.createdAt||x.expiryDate,date:x.expiryDate||dateOnly(),type:'تسجيل إكسباير',qty:num(x.qty),cost:num(x.cost),value:num(x.qty)*num(x.cost),supplier:x.supplier||'مورد عام',user:x.user||'—',ref:x.id,note:x.note||'',remaining:num(x.remaining)}));
 reps.forEach(x=>ops.push({at:x.createdAt||x.date,date:x.date||dateOnly(),type:'استبدال',qty:-num(x.qty),cost:0,value:0,supplier:x.supplier||'مورد عام',user:x.user||'—',ref:x.id,note:x.note||'',remaining:null}));
 purchases.forEach(({pur,item})=>ops.push({at:pur.createdAt||pur.date,date:pur.date||dateOnly(),type:'استلام مشتريات',qty:num(item.qty),cost:num(item.cost),value:num(item.qty)*num(item.cost),supplier:pur.supplier||'مورد عام',user:pur.user||'—',ref:pur.number||pur.id,note:'',remaining:null}));
 ops.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
 return {p,ex,reps,purchases,expired,replaced,remaining,value,ops};
}

  const resolve=()=>showProduct(productByQuery($('#purchaseSearch').value));

  $('#purchaseSearch').addEventListener('change',resolve);
  $('#purchaseSearch').addEventListener('blur',()=>{if($('#purchaseSearch').value.trim())resolve()});

  $('#addPurchaseItem').onclick=()=>{
   const p=selectedProduct||productByQuery($('#purchaseSearch').value);
   if(!p)return toast('اختر صنفًا صحيحًا أولًا');
   const qty=num($('#purchaseQty').value),cost=num($('#purchaseCost').value);
   if(qty<=0)return toast('أدخل كمية صحيحة');
   if(cost<0)return toast('أدخل تكلفة صحيحة');
   let discount=($('#purchaseDiscount').value||'0%').trim()||'0%';
   if(/^\d+(?:\.\d+)?$/.test(discount))discount+='%';
   const unitCode=($('#purchaseUnitCode').value||p.unitCode||db.settings.unitCodeMap?.[p.unit||'']||'').trim();
   items.push({
    productId:p.id,unitCode,qty,cost,
    variant:($('#purchaseVariant').value||'').trim(),
    taxRate:($('#purchaseTax').value||p.taxRate||'').trim(),
    discount,
    expiry:($('#purchaseExpiry').value||'').trim()
   });
   if(unitCode){
    p.unitCode=unitCode;
    db.settings.unitCodeMap[p.unit||'حبة']=unitCode;
    productsNeedSync=true;saveLocal();
   }
   $('#purchaseSearch').value='';$('#purchaseQty').value='1';$('#purchaseCost').value='';
   $('#purchaseUnitCode').value='';$('#purchaseVariant').value='';$('#purchaseDiscount').value='0%';$('#purchaseExpiry').value='';
   selectedProduct=null;$('#purchaseSelected').classList.add('hidden');draw();$('#purchaseSearch').focus();
  };

  $('#purchaseItems').onclick=e=>{const b=e.target.closest('[data-remove-item]');if(b){items.splice(Number(b.dataset.removeItem),1);draw()}};

  $('#savePurchaseBtn').onclick=()=>{
   if(!items.length)return toast('أضف صنفًا واحدًا على الأقل');
   const pur={id:id('pur'),number:'PUR-'+Date.now(),date:$('#purchaseDate').value||dateOnly(),supplier:($('#supplier').value||'مورد عام').trim()||'مورد عام',items,user:currentUser.name,status:'pending',createdAt:now()};
   db.purchases.unshift(pur);audit('استلام مشتريات',`${pur.number} — ${pur.supplier} — بانتظار المراجعة`);closeModal();render();toast('تم حفظ الفاتورة وإرسالها للمراجعة');
  };
  draw();setTimeout(()=>$('#purchaseSearch')?.focus(),50);
 })
}
function normalizeHeader(v){return String(v??'').replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().toLowerCase()}
function parseCsvLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function loadXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-xlsx-lazy]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(new Error('تعذر تحميل قارئ Excel')),{once:true});return}const script=document.createElement('script');script.dataset.xlsxLazy='1';script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('تعذر تحميل قارئ Excel — تحقق من الإنترنت'));document.head.appendChild(script)})}
async function importProducts(file,mode='merge'){
 if(!file)return;
 showImportProgress('جاري قراءة ملف الأصناف…');
 try{
  let rows=[];
  updateImportProgress(0,1,'فتح الملف وقراءة البيانات…');
  if(file.name.toLowerCase().endsWith('.csv')){
   const txt=(await file.text()).replace(/^\uFEFF/,'');
   const lines=txt.split(/\r?\n/).filter(x=>x.trim());
   const h=parseCsvLine(lines[0]||'');
   rows=lines.slice(1).map(l=>{const vals=parseCsvLine(l);return Object.fromEntries(h.map((k,i)=>[k,vals[i]??'']))});
  }else{
   await loadXLSX();
   const data=await file.arrayBuffer();
   const book=XLSX.read(data,{type:'array'});
   rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:'',raw:false});
  }
  if(!rows.length)throw new Error('الملف لا يحتوي على أصناف');
  setImportProgressTitle(mode==='replace'?'جاري تجهيز القائمة الجديدة…':'جاري تحديث قائمة الأصناف…');
  updateImportProgress(0,rows.length,'مطابقة أعمدة ملف سمارت…');

  const oldProducts=[...db.products];
  const bySmart=new Map(oldProducts.filter(p=>p.smartCode).map(p=>[String(p.smartCode),p]));
  const byBarcode=new Map(oldProducts.filter(p=>p.barcode).map(p=>[String(p.barcode),p]));
  const target=mode==='replace'?[]:[...oldProducts];
  const targetIds=new Set(target.map(p=>p.id));
  let added=0,updated=0,skipped=0;

  for(let idx=0;idx<rows.length;idx++){
   const r=rows[idx],entries=Object.entries(r);
   const val=(...names)=>{const wanted=names.map(normalizeHeader);const hit=entries.find(([k])=>wanted.includes(normalizeHeader(k)));return hit?hit[1]:''};
   const smart=String(val('الرقم','رقم الصنف','رقم','Product Code')).trim();
   const barcode=String(val('الباركود','باركود','Barcode')).trim();
   const name=String(val('الاسم','اسم الصنف','الصنف','اسم المنتج','Product Name','Name')).trim();
   const cost=num(val('التكلفة','سعر التكلفة','Net Unit Cost','Cost'));
   const salePrice=num(val('سعر البيع','Sale Price'));
   const unit=String(val('الوحدة','Unit')).trim()||'حبة';
   const explicitUnitCode=String(val('كود الوحدة','Unit Code')).trim();
   const taxRate=String(val('الضريبة','Tax Rate Name','Tax')).trim()||db.settings.smartTax||'15%';
   const category=String(val('الفئات الأساسية','الفئة','Category')).trim();
   if(!name||(!smart&&!barcode)){skipped++;continue}
   const existing=(smart&&bySmart.get(smart))||(barcode&&byBarcode.get(barcode));
   const unitCode=explicitUnitCode||(existing?.unitCode)||db.settings.unitCodeMap?.[unit]||'';const dataObj={smartCode:smart,barcode,name,cost,salePrice,unit,unitCode,taxRate,category};
   if(existing){
    const updatedObj=Object.assign({},existing,dataObj);
    const pos=target.findIndex(p=>p.id===existing.id);
    if(pos>=0)target[pos]=updatedObj;else target.push(updatedObj);
    targetIds.add(existing.id);updated++;
   }else{
    const obj=Object.assign({id:id('p')},dataObj);target.push(obj);targetIds.add(obj.id);added++;
   }
   if(idx%150===0||idx===rows.length-1){updateImportProgress(idx+1,rows.length,'معالجة الأصناف وتجهيزها للحفظ…');await new Promise(r=>setTimeout(r,0))}
  }

  db.products=target;
  invalidateCaches();productPage=1;productQuery='';
  saveLocal();lastLocalMutationAt=Date.now();cloudDirty=true;
  db.audit.unshift({id:id('a'),at:now(),user:currentUser?.name||'النظام',action:mode==='replace'?'استبدال ملف الأصناف':'تحديث ملف الأصناف',detail:`الإجمالي ${rows.length}، جديد ${added}، محدث ${updated}، متجاوز ${skipped}`});
  db.audit=db.audit.slice(0,500);saveLocal();

  const cloudCount=await syncProductsToCloud({replace:mode==='replace'});productsNeedSync=false;
  updateImportProgress(cloudCount,db.products.length,'التحقق النهائي من عدد الأصناف في Supabase…');
  const verified=await verifyCloudProducts({showMessage:false});
  if(verified<db.products.length)throw new Error(`فشل التحقق: الجهاز يحتوي ${db.products.length} والسحابة تحتوي ${verified}`);
  hideImportProgress();render();
  toast(`تمت المزامنة بنجاح: ${verified.toLocaleString('en-US')} صنف في السحابة`);
 }catch(err){
  console.error(err);hideImportProgress();setCloudStatus('error','تعذر مزامنة الأصناف');toast('تعذر رفع الأصناف للسحابة، لكن بيانات هذا الجهاز والإكسباير محفوظة. السبب: '+err.message);
 }finally{const f=$('#productFile');if(f)f.value=''}
}
function csvEscape(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function smartExpiryDate(v){if(!v)return'';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[2]}/${m[3]}/${m[1]}`:String(v)}
function exportSmart(pur){if(!pur)return;if(purchaseStatus(pur)!=='approved')return toast('يجب اعتماد الفاتورة قبل التصدير إلى سمارت');const head=['Product Code','Unit Code','Net Unit Cost','Quantity','Product Variant','Tax Rate Name','Discount','Expiry'];const lines=[head.map(csvEscape).join(',')];let missing=0;smartPurchaseRows(pur).forEach(r=>{if(!r.productCode||!r.unitCode)missing++;const row=[r.productCode,r.unitCode,String(r.cost),String(r.qty),r.variant,r.taxRate,r.discount,r.expiry];lines.push(row.map(csvEscape).join(','))});if(missing)return toast(`تعذر التصدير: ${missing} صنف ناقص Product Code أو Unit Code في سمارت`);download(`SMART_PURCHASE_${pur.number}.csv`,'\uFEFF'+lines.join('\r\n')+'\r\n','text/csv;charset=utf-8');audit('تصدير فاتورة لسمارت',pur.number)}
function sendWhatsApp(pur){const phone=db.settings.phone.replace(/\D/g,'');const total=pur.items.reduce((s,i)=>s+num(i.qty)*num(i.cost),0);const text=`استلام مشتريات ${pur.number}\nالمورد: ${pur.supplier}\nعدد الأصناف: ${pur.items.length}\nالإجمالي: ${money(total)} ر.س`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank')}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importSuppliers(file){if(!file)return;try{let names=[];const lower=file.name.toLowerCase();if(lower.endsWith('.csv')||lower.endsWith('.txt')){const txt=(await file.text()).replace(/^\uFEFF/,'');names=txt.split(/\r?\n/).flatMap(line=>parseCsvLine(line)).map(x=>String(x||'').trim()).filter(Boolean)}else{await loadXLSX();const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});for(const row of rows)for(const cell of row){const v=String(cell||'').trim();if(v)names.push(v)}}names=names.filter((x,i)=>i>0||!/اسم|مورد|supplier/i.test(x));db.settings.suppliers=[...new Set(['مورد عام',...db.settings.suppliers,...names])];saveDB();const ta=$('#supplierList');if(ta)ta.value=db.settings.suppliers.join('\n');toast(`تم استيراد ${names.length} اسم مورد`)}catch(err){console.error(err);toast('تعذر استيراد الموردين: '+(err.message||''))}}
function backup(){download(`expiry_backup_${dateOnly()}.json`,JSON.stringify(db,null,2),'application/json')}
async function restore(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data.users||!data.products)throw new Error('ملف غير صالح');db=data;saveDB();audit('استعادة نسخة احتياطية');toast('تمت الاستعادة');navigate('dashboard')}catch(e){toast(e.message)}}
function applyRoleUI(){$$('#mainNav [data-route]').forEach(b=>b.classList.toggle('hidden',!canRoute(b.dataset.route)));const roleLabel=document.querySelector('.user-chip b');if(roleLabel)roleLabel.textContent=currentUser?.role||'مستخدم'}
async function login(){
 const input=$('#pinInput'),btn=$('#loginBtn');
 const pin=String(input?.value||'').replace(/\D/g,'').trim();
 if(!pin)return toast('أدخل الرقم السري');
 const matchUser=()=>db.users.find(x=>x&&x.active!==false&&String(x.pin??'').trim()===pin);
 let u=matchUser();
 try{
  if(!u){
   btn.disabled=true;btn.textContent='تحقق…';
   await pullUsersOnly();
   u=matchUser();
  }
 }catch(e){console.warn('Login cloud check skipped',e)}
 finally{btn.disabled=false;btn.textContent='دخول'}
 if(!u){
   // ضمان عدم فقد دخول المدير الأساسي إذا كانت بيانات المستخدم السحابية قديمة أو PIN مخزن كرقم.
   if(pin==='2580'){
     u=db.users.find(x=>x&&String(x.pin??'')==='2580')||structuredClone(defaultDB.users[0]);
     if(!db.users.some(x=>String(x.id)===String(u.id)))db.users.unshift(u);
   }else return toast('الرقم السري غير صحيح');
 }
 currentUser=u;
 $('#currentUserName').textContent=u.name||'مستخدم';
 applyRoleUI();
 $('#loginView').classList.add('hidden');
 $('#appView').classList.remove('hidden');
 db.audit.unshift({id:id('a'),at:now(),user:u.name||'مستخدم',action:'تسجيل دخول',detail:''});
 db.audit=db.audit.slice(0,500);
 saveLocal();
 navigate('dashboard');
 if(!db.products.length)pullProductsIfEmpty().then(()=>{if(currentUser&&currentRoute==='dashboard')render()});
}
window.expiryDoLogin=login;
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);setCloudStatus('error','خطأ سحابي')});
async function init(){
 $('#pinPad').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(!b)return;const k=b.dataset.key,i=$('#pinInput');if(k==='clear')i.value='';else if(k==='back')i.value=i.value.slice(0,-1);else if(i.value.length<6)i.value+=k});
 $('#loginBtn').addEventListener('click',login);$('#pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
 $('#mainNav').addEventListener('click',e=>{const b=e.target.closest('button[data-route]');if(!b)return;navigate(b.dataset.route)});$('#menuBtn').addEventListener('click',openSidebar);$('#sidebarBackdrop').addEventListener('click',closeSidebar);$('#logoutBtn').addEventListener('click',()=>{currentUser=null;$('#pinInput').value='';$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')});
 const syncBtn=$('#syncNowBtn');if(syncBtn)syncBtn.addEventListener('click',async()=>{await cloudPush();await cloudPull({silent:false});toast('تمت المزامنة')});window.addEventListener('online',()=>{pullUsersOnly();if(!db.products.length)pullProductsIfEmpty()});pullUsersOnly();if(!db.products.length)pullProductsIfEmpty();setupRealtime();setInterval(()=>{if(!document.hidden)pullUsersOnly()},60000)
}
document.addEventListener('DOMContentLoaded',init);
})();
