<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a31">
<title>سنابل | مساعد المشتريات</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7f5;font-family:Tahoma,Arial,sans-serif}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#173d2f;font-size:18px;font-weight:700;text-align:center}
.err{color:#9b2c23;max-width:680px;line-height:1.8}
</style>
</head>
<body>
<div id="boot">جاري تحميل مساعد المشتريات…</div>
<script>
(async()=>{
  const BASE='https://rueapdmdkjytsxkfumpw.supabase.co/functions/v1/sanabel-supplier-app';
  const ENH='https://rueapdmdkjytsxkfumpw.supabase.co/functions/v1/sanabel-supplier-app-web';

  const readJsonString=(src,start)=>{
    let i=start; while(/\s/.test(src[i]||''))i++;
    if(src[i]!==String.fromCharCode(34)) throw new Error('تعذر قراءة تحديثات الواجهة');
    let esc=false;
    for(let j=i+1;j<src.length;j++){
      const ch=src[j];
      if(esc){esc=false;continue}
      if(ch==='\\'){esc=true;continue}
      if(ch===String.fromCharCode(34)){
        return {value:JSON.parse(src.slice(i,j+1)),end:j+1};
      }
    }
    throw new Error('تحديثات الواجهة غير مكتملة');
  };

  try{
    const [b,e]=await Promise.all([
      fetch(BASE+'?v='+Date.now(),{cache:'no-store'}),
      fetch(ENH+'?v='+Date.now(),{cache:'no-store'})
    ]);
    if(!b.ok) throw new Error('تعذر تحميل التطبيق الأساسي');
    if(!e.ok) throw new Error('تعذر تحميل تحسينات التطبيق');

    let html=await b.text();
    const enh=await e.text();

    const cpos=enh.indexOf(',css=');
    const jpos=enh.indexOf(',js=',cpos+5);
    if(cpos<0||jpos<0) throw new Error('صيغة تحديث الواجهة غير متوافقة');

    const css=readJsonString(enh,cpos+5).value;
    const js=readJsonString(enh,jpos+4).value;

    html=html.replace('</head>','<style id="sanabel-pro-ui">'+css+'</style></head>');
    const safeJs=js.replace(/<\/script/gi,'<\\/script');
    html=html.replace('</body>','<script id="sanabel-price-js">'+safeJs+'<\/script></body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML=
      '<div class="err">تعذر تحميل التطبيق الآن.<br>'+String(err&&err.message||err)+'</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
